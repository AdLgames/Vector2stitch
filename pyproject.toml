[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector2stitch-engine"
version = "0.1.0"
description = "Deterministic auto-digitizing engine: artwork -> embroidery objects -> stitches"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "pyembroidery>=1.4.35,<1.5",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
v2s = "engine.cli.main:main"
v2s-lab = "lab.cli:main"

[tool.setuptools.packages.find]
include = ["engine*", "lab*"]

[tool.setuptools.package-data]
"engine.profiles" = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
