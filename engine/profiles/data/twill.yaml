# Twill / canvas / denim -- the stable baseline profile.
#
# Every number here is an industry-typical starting default, NOT a calibrated
# value. `calibrated: false` is the engine's way of saying so out loud: until a
# sew-out on our own machines moves these, no file made with this profile is
# trusted output. See the quality doc, header note and section 5.
name: twill
version: 1
description: Twill, canvas and denim. Stable, low stretch; the baseline profile.
calibrated: false

classification:
  run_max_width_mm: 1.0      # below this a column cannot hold a satin
  satin_max_width_mm: 7.0    # above this, tatami fill or split satin
  min_text_height_mm: 4.5    # with 40 wt thread; below this, route to a human

stitch:
  run_length_mm: 2.2
  fill_length_mm: 3.5
  min_length_mm: 0.5         # hard floor; shorter stitches are filtered out
  max_length_mm: 12.0        # machine limit; longer runs are split
  bean_repeats: 1
  tie_length_mm: 0.8        # tie-in / tie-off stitch length
  tie_stitches: 3           # penetrations per tie, on every object start and before every trim

density:
  fill_row_spacing_mm: 0.40
  satin_spacing_mm: 0.40
  overlap_scale: 0.85        # thin out where layers stack, to avoid a patch

compensation:
  pull_comp_mm_per_side: 0.175   # per side, along stitch direction
  push_comp_mm: 0.15             # trimmed off fill ends, perpendicular to pull

underlay:
  satin_narrow: [center_run]     # below satin_narrow_max_width_mm
  satin_medium: [edge_run]
  satin_wide: [edge_run, zigzag]
  fill: [edge_run, tatami_low]
  satin_narrow_max_width_mm: 2.0
  satin_medium_max_width_mm: 4.0
  inset_mm: 0.3                  # so underlay never peeks out past the top layer

routing:
  trim_threshold_mm: 6.0         # travel longer than this gets a trim
  overlap_margin_mm: 0.3         # kept when removing hidden stitches
  sequencing: default            # default | center_out

materials:
  stabilizer: "cutaway 2.0 oz"
  topping: false
