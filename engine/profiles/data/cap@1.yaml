# Structured cap front. Curved, unforgiving, and sewn on a driver rather than
# a flat hoop: sequencing is center-out and bottom-up, not a preference.
#
# Starting defaults, not calibrated values -- see twill.yaml and the quality doc.
name: cap
version: 1
description: Structured cap front. Center-out sequencing; limited sew field height.
calibrated: false

classification:
  run_max_width_mm: 1.0
  satin_max_width_mm: 6.0    # tighter than flat goods; wide fills distort on the curve
  min_text_height_mm: 5.0

stitch:
  run_length_mm: 2.0
  fill_length_mm: 3.2
  min_length_mm: 0.5
  max_length_mm: 12.0
  bean_repeats: 1
  tie_length_mm: 0.8        # tie-in / tie-off stitch length
  tie_stitches: 3           # penetrations per tie, on every object start and before every trim

density:
  fill_row_spacing_mm: 0.40
  satin_spacing_mm: 0.38     # denser than flat goods: buckram is stiff, the column needs holding
  overlap_scale: 0.85

satin:
  # A column on a curve crowds its inner rail. Below this spacing the
  # penetrations pile into one hole: thread break, then needle break.
  short_stitch_min_spacing_mm: 0.25
  # How far a shortened stitch crosses the column. Short enough to relieve the
  # pile-up, long enough that the gap does not read as a notch in the edge.
  short_stitch_depth: 0.65
  # Lanes of a split column overlap by this, so the seam between them does not
  # show as a line of fabric.
  split_overlap_mm: 0.3

compensation:
  pull_comp_mm_per_side: 0.30
  push_comp_mm: 0.20

underlay:
  satin_narrow: [center_run]
  satin_medium: [edge_run, zigzag]
  satin_wide: [edge_run, zigzag]
  fill: [edge_run, tatami_low]
  satin_narrow_max_width_mm: 2.0
  satin_medium_max_width_mm: 4.0
  inset_mm: 0.3
  zigzag_spacing_multiplier: 3.0   # underlay zigzag is open; it supports, it does not cover

routing:
  trim_threshold_mm: 6.0
  overlap_margin_mm: 0.3
  sequencing: center_out

materials:
  stabilizer: "none (buckram)"
  topping: false

machine:
  thread_weight_wt: 40
  thread_type: polyester
  needle_size: "75/11"
  max_spm: 600                  # a structured cap on a driver; most machines throttle here
  bobbin_tension_gf_min: 25     # higher baseline: dense, structured seams loop otherwise
  bobbin_tension_gf_max: 30
  top_to_bobbin_tension_ratio: 1.9
