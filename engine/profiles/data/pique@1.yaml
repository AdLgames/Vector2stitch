# Pique polo knit. Textured surface, some stretch.
#
# Starting defaults, not calibrated values -- see twill.yaml and the quality doc.
name: pique
version: 1
description: Pique polo knit. Textured; needs heavier underlay to bridge the weave.
calibrated: false

classification:
  run_max_width_mm: 1.0
  satin_max_width_mm: 7.0
  min_text_height_mm: 5.0    # texture closes counters sooner than twill does

stitch:
  run_length_mm: 2.2
  fill_length_mm: 3.5
  min_length_mm: 0.5
  max_length_mm: 12.0
  bean_repeats: 1
  tie_length_mm: 0.8        # tie-in / tie-off stitch length
  tie_stitches: 3           # penetrations per tie, on every object start and before every trim

density:
  fill_row_spacing_mm: 0.45  # the knit puckers under heavy fill; commercial practice is 0.45-0.50
  satin_spacing_mm: 0.40
  overlap_scale: 0.85

satin:
  # A column on a curve crowds its inner rail. Below this spacing the
  # penetrations pile into one hole: thread break, then needle break.
  short_stitch_min_spacing_mm: 0.25
  # How far a shortened stitch crosses the column. Short enough to relieve the
  # pile-up, long enough that the gap does not read as a notch in the edge.
  short_stitch_depth: 0.65
  # Lanes of a split column overlap by this, so the seam between them does not
  # show as a line of fabric.
  split_overlap_mm: 0.3

fill:
  # Rows at 45 degrees by default: a fill sewn along a shape's own axis shows
  # every row end as a ragged edge. Per-object angle overrides this.
  default_angle_deg: 45.0
  # Penetrations stacked in a column across rows cut the fabric along that
  # line and read as a seam through the fill. Each row shifts by 1/4 stitch.
  stagger_steps: 4
  # A span narrower than this cannot hold a stitch. It is left to the outline
  # or the satin bordering it rather than sewn as a stub.
  min_span_mm: 1.0
  # Rows are sampled on scanlines, so where a hole's corner falls between two
  # of them the turn can clip the corner by up to half a row spacing. Holes
  # are grown by this much before the fill is generated, which keeps a window
  # genuinely bare; the hairline it leaves is covered by the edge-run underlay
  # and by whatever borders the shape.
  hole_clearance_mm: 0.3

compensation:
  pull_comp_mm_per_side: 0.35
  push_comp_mm: 0.25

underlay:
  satin_narrow: [center_run]
  satin_medium: [edge_run, zigzag]     # heavier than twill: bridge the weave
  satin_wide: [edge_run, zigzag]
  fill: [edge_run, tatami_low]
  satin_narrow_max_width_mm: 2.0
  satin_medium_max_width_mm: 4.0
  inset_mm: 0.3
  zigzag_spacing_multiplier: 3.0   # underlay zigzag is open; it supports, it does not cover
  tatami_spacing_multiplier: 4.0   # fill underlay is far more open than the layer above it
  tatami_angle_offset_deg: 90.0    # crossing the top layer is what makes it support   # underlay zigzag is open; it supports, it does not cover

routing:
  trim_threshold_mm: 6.0
  overlap_margin_mm: 0.3
  sequencing: default

materials:
  stabilizer: "cutaway 2.0 oz"
  topping: true              # water-soluble: the weave texture swallows edges without it

machine:
  thread_weight_wt: 40
  thread_type: polyester
  needle_size: "75/11"
  max_spm: 1000
  bobbin_tension_gf_min: 18
  bobbin_tension_gf_max: 22
  top_to_bobbin_tension_ratio: 1.9
