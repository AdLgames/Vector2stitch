name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  # Pinned so IR documents, stitch plans and file fingerprints are reproducible.
  V2S_ENGINE_VERSION: ci

jobs:
  checks:
    name: lint + tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  determinism:
    # The same design must produce byte-identical files on any host. Running
    # this on a second OS is what actually proves it -- see the committed
    # fingerprints in tests/fingerprints.json.
    name: determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_determinism.py -q

  golden:
    # Real designs, regenerated end to end and compared against output that was
    # approved deliberately. A difference here is not automatically wrong -- it
    # may be an improvement -- but changing engine output without saying so is.
    name: golden suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: v2s-lab golden
      - run: pytest tests/test_golden.py tests/test_checks.py -q

  # The suite is seeded with the calibration patterns on every shipped profile,
  # plus the hand-authored examples. Real customer artwork joins it once ingest
  # lands (M3), and a metric shift needs a digitizer's sign-off once there is
  # one to ask.
